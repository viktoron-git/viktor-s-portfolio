<svg width="220" height="48" viewBox="0 0 220 48" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .mark-bg { fill: rgba(127,119,221,0.1); stroke: #534AB7; stroke-width: 1; }
    .mark-sym { font-family: 'IBM Plex Mono', monospace; font-size: 16px; fill: #7F77DD; }
    .word-main { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 22px; fill: #F2F2ED; }
    .word-accent { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 22px; fill: #7F77DD; }
  </style>

  <!-- prompt icon -->
  <rect class="mark-bg" x="0" y="6" width="36" height="36" rx="8" />
  <text class="mark-sym" x="18" y="30" text-anchor="middle">&gt;_</text>

  <!-- wordmark -->
  <text x="48" y="31">
    <tspan class="word-main">viktor</tspan><tspan class="word-accent">.dev</tspan>
  </text>
</svg>
